<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Reload App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-bottom: 10px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-start {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(235, 51, 73, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .saved-url {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .saved-url-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .saved-url-text {
            color: #1976D2;
            font-weight: 500;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .webview-container {
            flex: 1;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden {
            display: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-left: 4px solid #38ef7d;
        }

        .notification.error {
            border-left: 4px solid #eb3349;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 Auto Reload App</h1>
            <p>සෑම තත්පර 20 කට වරක් reload වේ</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label for="urlInput">🔗 Website Link එක</label>
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="example.com හෝ https://example.com"
                    autocomplete="off"
                >
            </div>
            <button class="btn btn-save" onclick="saveUrl()">💾 Save කරන්න</button>
        </div>

        <div id="savedUrlCard" class="card hidden">
            <div class="saved-url">
                <div class="saved-url-label">Saved URL:</div>
                <div class="saved-url-text" id="savedUrlText"></div>
            </div>
            <button id="startBtn" class="btn btn-start" onclick="startReload()">▶️ Start කරන්න</button>
            <button id="stopBtn" class="btn btn-stop hidden" onclick="stopReload()">⏹️ Stop කරන්න</button>
        </div>

        <div id="statusCard" class="status hidden">
            <div class="status-dot"></div>
            <span>Running - තත්පර 20 කට reload වේ</span>
        </div>

        <div id="webviewContainer" class="webview-container hidden">
            <iframe id="webview" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        </div>
    </div>

    <script>
        let savedUrl = '';
        let isRunning = false;
        let reloadInterval = null;

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function saveUrl() {
            const urlInput = document.getElementById('urlInput');
            let url = urlInput.value.trim();

            if (!url) {
                showNotification('කරුණාකර link එකක් ඇතුළත් කරන්න', 'error');
                return;
            }

            // Add https:// if not present
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            savedUrl = url;
            document.getElementById('savedUrlText').textContent = savedUrl;
            document.getElementById('savedUrlCard').classList.remove('hidden');
            
            showNotification('✅ Link එක save කරන ලදී!');

            // Save to localStorage
            localStorage.setItem('savedUrl', savedUrl);
        }

        function startReload() {
            if (!savedUrl) {
                showNotification('කරුණාකර පළමුව link එක save කරන්න', 'error');
                return;
            }

            isRunning = true;
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');
            document.getElementById('statusCard').classList.remove('hidden');
            document.getElementById('webviewContainer').classList.remove('hidden');
            document.getElementById('urlInput').disabled = true;

            // Load initial page
            loadPage();

            // Set interval for auto-reload (20 seconds)
            reloadInterval = setInterval(() => {
                loadPage();
                console.log('Reloading:', new Date().toLocaleTimeString());
            }, 20000);

            showNotification('🚀 Auto reload ආරම්භ කරන ලදී!');
        }

        function stopReload() {
            isRunning = false;
            clearInterval(reloadInterval);
            reloadInterval = null;

            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('statusCard').classList.add('hidden');
            document.getElementById('urlInput').disabled = false;

            showNotification('⏹️ Auto reload නතර කරන ලදී');
        }

        function loadPage() {
            const iframe = document.getElementById('webview');
            // Force reload by changing src
            iframe.src = savedUrl + '?t=' + Date.now();
        }

        // Load saved URL on page load
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('savedUrl');
            if (saved) {
                savedUrl = saved;
                document.getElementById('urlInput').value = saved;
                document.getElementById('savedUrlText').textContent = saved;
                document.getElementById('savedUrlCard').classList.remove('hidden');
            }
        });

        // Prevent accidental page close when running
        window.addEventListener('beforeunload', (e) => {
            if (isRunning) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
